server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = /weather-dashboard {
        return 301 /weather-dashboard/;
    }

    location ~ ^/weather-dashboard/(api|internal)/ {
        rewrite ^/weather-dashboard/(.*)$ /$1 break;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Tailscale Serve may strip /weather-dashboard before forwarding.
    # Keep the API reachable in that form as well as through the local prefix.
    location ~ ^/(api|internal)/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /weather-dashboard/ {
        rewrite ^/weather-dashboard/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

