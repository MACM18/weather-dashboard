name: weather-dashboard

services:
  db:
    image: postgres:17-alpine
    container_name: weather-dashboard-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-weather_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-weather_dashboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: weather-dashboard-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-weather_dashboard}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-weather_dashboard}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      MONITOR_INGEST_TOKEN: ${MONITOR_INGEST_TOKEN:?Set MONITOR_INGEST_TOKEN in .env}
      CONTROL_TOKEN: ${CONTROL_TOKEN:?Set CONTROL_TOKEN in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      RETENTION_DAYS: ${RETENTION_DAYS:-90}
      SHUTDOWN_ENABLED: ${SHUTDOWN_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    container_name: weather-dashboard-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8788}:80"
    depends_on:
      - api

